name: Release

# Pushing a v* tag publishes a downloadable build for it.
#
# The tag is the version. Nothing reads apps/desktop/package.json, whose version
# is only a placeholder for local builds, so there is no bump to remember and no
# way to ship a number that disagrees with the tag.
#
#   gh release create v0.1.1 --generate-notes   # creates the tag and this runs
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, such as v0.1.1'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'GlassBox-AI-Labs/gauntlet-gamesmith'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # The tag has to be checked against main's history below.
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$TAG is not a version tag. Use vMAJOR.MINOR.PATCH, such as v0.1.1." >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A download must come from reviewed history, not from whatever branch the
      # tag happened to be cut on.
      - name: Require the tag to be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${{ steps.version.outputs.tag }} does not point at a commit on main." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A broken build must never reach a download page.
      - run: pnpm typecheck
      - run: pnpm test

      # Apple-trusted downloads need a Developer ID certificate and notarization
      # credentials. Without them the build is ad hoc signed and macOS blocks it
      # on first open, so the release notes have to say which one this is.
      - id: signing
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate or notarization key is configured; building an ad hoc signed release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed and notarized macOS downloads
        if: steps.signing.outputs.trusted == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          # electron-builder wants a path to the .p8, not its contents.
          key_file="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file"
          export APPLE_API_KEY="$key_file"
          pnpm package:mac:release -c.extraMetadata.version="$VERSION"
          rm -f "$key_file"

      - name: Build ad hoc signed macOS downloads
        if: steps.signing.outputs.trusted != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm package:mac -c.extraMetadata.version="$VERSION"

      - name: Launch the packaged app before publishing it
        run: pnpm --filter @gauntlet/desktop smoke:mac

      # The tag is the version, so the built app must actually carry it.
      - name: Check the built app carries the tagged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "dist/mac-arm64/Gauntlet Gamesmith.app/Contents/Info.plist")
          if [ "$built" != "$VERSION" ]; then
            echo "::error::The packaged app reports $built but the tag says $VERSION." >&2
            exit 1
          fi

      - name: Compose the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${{ steps.signing.outputs.trusted }}" = "true" ]; then
            signing_section=$'## Opening it\n\nThis build is signed and notarized by Apple, so it opens normally.'
          else
            signing_section=$'## macOS will block this app the first time\n\nThis build is not signed with an Apple developer certificate, so macOS refuses\nto open it until you say it is fine. Nothing is wrong with the file.\n\n1. Drag the app into your Applications folder.\n2. Double-click it. Dismiss the warning.\n3. Open **System Settings → Privacy & Security**, scroll down, and click\n   **Open Anyway**.\n\nYou only do this once.'
          fi
          python3 - "$VERSION" "$signing_section" <<'PY' > "$RUNNER_TEMP/notes.md"
          import pathlib, sys
          version, signing = sys.argv[1], sys.argv[2]
          body = pathlib.Path('.github/release-notes-template.md').read_text()
          print(body.replace('__VERSION__', version).replace('__SIGNING_SECTION__', signing))
          PY

      # A release created by `gh release create` before this run keeps its notes;
      # the assets are added to it. Otherwise the release is created here, so a
      # tag pushed with plain git still produces a complete page.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$TAG" \
              --title "Gauntlet Gamesmith $VERSION (macOS)" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              dist/*.dmg dist/*.zip
          fi
