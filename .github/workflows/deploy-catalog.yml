name: Deploy catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'GlassBox-AI-Labs/gauntlet-gamesmith'
    uses: ./.github/workflows/ci.yml

  deploy-catalog:
    name: Deploy production catalog
    needs: verify
    if: github.ref == 'refs/heads/main' && github.repository == 'GlassBox-AI-Labs/gauntlet-gamesmith'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: catalog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Skip superseded commits and old reruns
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deployment: main has advanced beyond $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy tested commit and wait for production alias
        if: steps.current.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/catalog-deploy.mjs
      - name: Verify public catalog and social previews
        if: steps.current.outputs.deploy == 'true'
        run: |
          node scripts/catalog-smoke.mjs --catalog https://gauntletgamesmith.com --games https://glassbox-games.vercel.app
          echo "Production smoke checks passed: https://gauntletgamesmith.com" >> "$GITHUB_STEP_SUMMARY"
